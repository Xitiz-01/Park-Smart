name: Bug report
description: Something in ParkSmart doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a customer
        2. Open …
        3. …
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Signed in as
      options: [Signed out, Customer, Vendor, Admin, Super admin]
  - type: input
    id: environment
    attributes:
      label: Where
      description: Local, preview or production, plus browser and device.
