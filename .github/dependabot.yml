# Weekly dependency updates. Minor and patch bumps arrive grouped; majors get
# their own PR. Docker images are added in Phase 3, when the Dockerfiles exist.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    # Let new releases age before they're proposed (supply-chain safety).
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
